# Optional local full-stack setup; deploy the Dockerfile directly through Coolify.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Dapur Th Sant}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env.docker}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env.docker}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      INITIAL_OWNER_EMAIL: "${INITIAL_OWNER_EMAIL:-}"
      INITIAL_OWNER_PASSWORD: "${INITIAL_OWNER_PASSWORD:-}"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env.docker}"
      MARIADB_USER: "${DB_USERNAME:?Set DB_USERNAME in .env.docker}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  laravel_storage:
  mariadb_data:
